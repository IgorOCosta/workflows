# =============================================================================
# REUTILIZAVEL — Pipeline de CI sobre o contrato de comandos (Makefile).
#
# Nao sabe qual e a stack. So chama alvos do Makefile do projeto, cujos
# comandos reais vivem em project.mk:
#
#   setup, format-check, lint, typecheck, test-coverage, build
#   + opcionais: bundle-budget, e2e-install, e2e, perf, openapi
#
# Um alvo com `skip` em project.mk passa avisando; um alvo vazio FALHA com
# instrucao. Esse e o comportamento desejado: nada de CI verde que nao roda.
#
# No proprio repositorio TEMPLATE (Settings > Template repository marcado) os
# jobs da stack sao pulados: ainda nao existe stack para testar.
#
# Uso (no ci.yml do projeto):
#
#   pipeline:
#     uses: IgorOCosta/workflows/.github/workflows/ci-make.yml@v1
#     permissions:
#       contents: read
#       pull-requests: read
#     with:
#       docker: true
#     secrets:
#       SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
# =============================================================================
name: Pipeline make

on:
  workflow_call:
    inputs:
      bundle-budget:
        description: Roda `make bundle-budget` depois do build (frontend).
        type: boolean
        default: false
      build-artifact:
        description: Publica o diretorio BUILD_DIR como artefato `build` (necessario para `performance`).
        type: boolean
        default: false
      e2e:
        description: Roda `make e2e-install` e `make e2e`.
        type: boolean
        default: false
      performance:
        description: Roda `make perf` sobre o artefato de build (Core Web Vitals).
        type: boolean
        default: false
      contract-path:
        description: Se definido, roda `make openapi` e falha se o contrato gerado diferir do commitado neste caminho.
        type: string
        default: ''
      docker:
        description: Valida que o Dockerfile da raiz constroi.
        type: boolean
        default: false
      sonar:
        description: Roda a analise do SonarCloud com Quality Gate bloqueante.
        type: boolean
        default: true
      sonar-needs-build:
        description: 'Roda make setup e make build antes do scanner (Java/Kotlin exigem binarios).'
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: false

jobs:
  # ---------------------------------------------------------------------------
  # So aparece no repositorio template, para deixar claro por que o resto pulou.
  # ---------------------------------------------------------------------------
  template-notice:
    name: Repositorio template
    if: github.event.repository.is_template == true
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "::notice title=Repositorio template::Jobs da stack pulados. Eles passam a rodar no projeto criado a partir deste template."

  quality:
    name: Lint, formato e tipos
    if: github.event.repository.is_template != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        if: hashFiles('.tool-versions', 'mise.toml', '.mise.toml') != ''
        with:
          cache: true

      - name: Setup
        run: make setup

      - name: Formato
        run: make format-check

      - name: Lint
        run: make lint

      - name: Tipos
        run: make typecheck

  tests:
    name: Testes com cobertura
    if: github.event.repository.is_template != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        if: hashFiles('.tool-versions', 'mise.toml', '.mise.toml') != ''
        with:
          cache: true

      - run: make setup

      - name: Testes com cobertura
        run: make test-coverage

      # Contrato: o relatorio fica em coverage/ (lcov.info de preferencia).
      # Consumido pelo SonarCloud (job abaixo) e pelo comentario do agente.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build
    if: github.event.repository.is_template != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build-dir: ${{ steps.contract.outputs.build-dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        if: hashFiles('.tool-versions', 'mise.toml', '.mise.toml') != ''
        with:
          cache: true

      - run: make setup

      - name: Ler BUILD_DIR do contrato
        id: contract
        run: echo "build-dir=$(make -s print-BUILD_DIR)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: make build

      - name: Orcamento de bundle
        if: inputs.bundle-budget
        run: make bundle-budget

      - uses: actions/upload-artifact@v4
        if: inputs.build-artifact
        with:
          name: build
          path: ${{ steps.contract.outputs.build-dir }}/
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: Testes e2e
    if: inputs.e2e && github.event.repository.is_template != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        if: hashFiles('.tool-versions', 'mise.toml', '.mise.toml') != ''
        with:
          cache: true

      - run: make setup

      - name: Dependencias do e2e
        run: make e2e-install

      - name: E2E
        run: make e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-report
          path: |
            playwright-report/
            cypress/screenshots/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  performance:
    name: Core Web Vitals
    if: inputs.performance && github.event.repository.is_template != true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        if: hashFiles('.tool-versions', 'mise.toml', '.mise.toml') != ''
        with:
          cache: true

      - run: make setup

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: ${{ needs.build.outputs.build-dir }}

      - name: Auditoria de performance
        run: make perf

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report
          path: |
            .lighthouseci/
            perf-report/
          retention-days: 7
          if-no-files-found: ignore

  contract:
    name: Contrato de API atualizado
    if: inputs.contract-path != '' && github.event.repository.is_template != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        if: hashFiles('.tool-versions', 'mise.toml', '.mise.toml') != ''
        with:
          cache: true

      - run: make setup

      - name: Gerar o contrato a partir do codigo
        run: make openapi

      - name: Comparar com o commitado
        env:
          CONTRACT_PATH: ${{ inputs.contract-path }}
        run: |
          if [ -n "$(git status --porcelain -- "$CONTRACT_PATH")" ]; then
            git --no-pager diff -- "$CONTRACT_PATH" || true
            echo "::error title=Contrato desatualizado::$CONTRACT_PATH nao bate com o codigo. Rode 'make openapi' e commite o resultado."
            exit 1
          fi
          echo "Contrato em dia: $CONTRACT_PATH"

  docker:
    name: Imagem Docker
    if: inputs.docker && github.event.repository.is_template != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Dockerfile presente
        run: |
          if [ ! -f Dockerfile ]; then
            echo "::error title=Dockerfile ausente::Copie docker/Dockerfile.example para a raiz e preencha (ver docker/README.md)."
            exit 1
          fi

      - name: Build da imagem (validacao, sem push)
        run: docker build --pull -t "ci-check:${GITHUB_SHA}" .

  sonarcloud:
    name: SonarCloud
    needs: tests
    # PR de fork e do Dependabot nao recebem os secrets do repositorio: pulado
    # de proposito, em vez de falhar ou vazar token.
    if: >-
      inputs.sonar &&
      github.event.repository.is_template != true &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verificar configuracao
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error title=SonarCloud nao configurado::Crie o secret SONAR_TOKEN (ver SETUP-GITHUB.md). Para dispensar de forma consciente, passe 'sonar: false' no ci.yml e registre o motivo."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # O Sonar usa o historico para atribuir autoria e calcular "new code".
          fetch-depth: 0

      - uses: jdx/mise-action@v2
        if: inputs.sonar-needs-build && hashFiles('.tool-versions', 'mise.toml', '.mise.toml') != ''
        with:
          cache: true

      - name: Build para o scanner
        if: inputs.sonar-needs-build
        run: make setup && make build

      # Reaproveita a cobertura do job de testes: os testes rodam uma vez so.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage
          path: coverage

      - name: Scanner + Quality Gate
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # Espera o Quality Gate e falha o job se ele reprovar.
          args: -Dsonar.qualitygate.wait=true
